apiVersion: apps/v1
kind: Deployment
metadata:
  name: dragonball-frontend
  namespace: dragonball
  labels:
    app: dragonball
spec:
  replicas: 2
  selector:
    matchLabels:
      app: dragonball
  template:
    metadata:
      labels:
        app: dragonball
    spec:
      containers:
      - name: dragonball
        image: enessermaxhaj/dragonball:latest
        imagePullPolicy: Always
        ports:
        - containerPort: 80
        # Health Checks për Self-Healing më të mirë
        livenessProbe:
          httpGet:
            path: /
            port: 80
